spring:
    application:
        name: weekly-tasks-backend

    servlet:
        multipart:
            max-file-size: 50MB
            max-request-size: 50MB

    datasource:
        url: ${DATASOURCE_URL:jdbc:mysql://mysql50-farm1.kinghost.net:3306/tibiacacau?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
        username: ${DATASOURCE_USERNAME:tibiacacau}
        password: ${DATASOURCE_PASSWORD:tibiacacau123}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQL8Dialect
                format_sql: true

server:
    port: ${PORT:8080}

cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,https://tibia-cacau.github.io}

reidoscoins:
    api:
        url: ${REIDOSCOINS_API_URL:https://www.reidoscoins.com.br/index.php}
        token: ${REIDOSCOINS_API_TOKEN:NBMRJK348THG3W7TRY2GHBV38245YR1291}

tibiadraptor:
    api:
        url: ${TIBIADRAPTOR_API_URL:https://tibiadraptor.com/api/v1}
    sync:
        enabled: ${TIBIADRAPTOR_SYNC_ENABLED:true}

logging:
    level:
        com.tibia: DEBUG
        org.springframework.orm.jpa: DEBUG
        org.hibernate.SQL: DEBUG
