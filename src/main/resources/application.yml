spring:
    application:
        name: weekly-tasks-backend

    servlet:
        multipart:
            max-file-size: 50MB
            max-request-size: 50MB

    datasource:
        url: ${DATASOURCE_URL}
        username: ${DATASOURCE_USERNAME}
        password: ${DATASOURCE_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQL8Dialect
                format_sql: false

server:
    port: ${PORT:8080}

cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,https://tibia-cacau.github.io}

reidoscoins:
    api:
        url: ${REIDOSCOINS_API_URL:https://www.reidoscoins.com.br/index.php}
        token: ${REIDOSCOINS_API_TOKEN}

tibiadraptor:
    api:
        url: ${TIBIADRAPTOR_API_URL:https://tibiadraptor.com/api/v1}
    sync:
        enabled: ${TIBIADRAPTOR_SYNC_ENABLED:true}

logging:
    level:
        root: INFO
        com.tibia: INFO
        org.springframework.orm.jpa: WARN
        org.hibernate.SQL: WARN
